# Проверки на каждый пуш и PR: тесты игры, сохранения, локализация, лицензии ассетов, экспорт пакета ресурсов.
# Сборка APK/веба — по тегу v* (job release): нужны секреты ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_USER, ANDROID_KEYSTORE_PASSWORD.
# Ссылки на Godot и шаблоны экспорта указаны для версии 4.7 и ни разу не запускались в этой среде: при первом запуске проверить.
name: ci

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:

env:
  GODOT_VERSION: "4.7"
  GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable
  GODOT_BIN: ${{ github.workspace }}/godot/Godot_v4.7-stable_linux.x86_64

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Godot
        run: |
          mkdir -p godot && cd godot
          curl -fsSL -o godot.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
      - name: Python-проверки (лицензии ассетов, локализация)
        run: |
          python3 tools/audit_assets.py
          python3 tools/loc_check.py
          python3 tools/check_content.py
      - name: Импорт ресурсов
        run: $GODOT_BIN --headless --path . --import || true
      - name: Тесты игры
        run: $GODOT_BIN --headless --path . res://tools/modes_test.tscn
      - name: Тесты платформы, сохранения, звука
        run: $GODOT_BIN --headless --path . res://tools/platform_test.tscn
      - name: Пакет ресурсов (проверка пресетов и размера)
        run: |
          mkdir -p build
          $GODOT_BIN --headless --path . --export-pack "Android (RuStore, APK)" build/warm-paw.pck
          ls -l build/warm-paw.pck
          test "$(stat -c %s build/warm-paw.pck)" -lt 83886080   # бюджет установки 80 МБ
      - uses: actions/upload-artifact@v4
        with:
          name: warm-paw-pck
          path: build/warm-paw.pck

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Godot и шаблоны экспорта
        run: |
          mkdir -p godot && cd godot
          curl -fsSL -o godot.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" && unzip -q godot.zip
          curl -fsSL -o tpz.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" && unzip -q tpz.zip
          mkdir -p ~/.local/share/godot/export_templates && mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
      - name: Подпись Android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=${{ secrets.ANDROID_KEYSTORE_USER }}" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Импорт и релизная сборка
        run: |
          $GODOT_BIN --headless --path . --import || true
          python3 tools/audit_assets.py --strict   # релиз только с подтверждёнными лицензиями
          mkdir -p build/android build/web
          $GODOT_BIN --headless --path . --export-release "Android (RuStore, APK)" build/android/warm-paw.apk
          $GODOT_BIN --headless --path . --export-release "Web (Yandex Games)" build/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: build/
